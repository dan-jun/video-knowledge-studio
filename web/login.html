<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Video Knowledge Studio</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;color:#e8f9ff;
  background:
    radial-gradient(50% 50% at 20% 10%,rgba(0,229,255,.13),transparent 65%),
    radial-gradient(45% 45% at 85% 85%,rgba(0,255,163,.1),transparent 65%),
    #05080d;font-family:"Microsoft YaHei",system-ui,sans-serif;
}
.card{
  width:min(390px,calc(100vw - 32px));padding:26px;border-radius:16px;
  border:1px solid rgba(0,229,255,.22);background:rgba(9,17,25,.96);
  box-shadow:0 24px 70px rgba(0,0,0,.5),0 0 35px rgba(0,229,255,.08);
}
.mark{
  width:38px;height:38px;display:grid;place-items:center;border-radius:11px;
  background:linear-gradient(135deg,#00e5ff,#00ffa3);color:#03191d;font-weight:900;
}
h1{margin:15px 0 5px;font-size:21px}p{margin:0 0 20px;color:#7694a1;font-size:12px;line-height:1.6}
label{display:block;margin-bottom:7px;color:#82b9c7;font-size:11px}
input{
  width:100%;padding:11px 12px;border-radius:9px;border:1px solid rgba(0,229,255,.2);
  background:rgba(0,229,255,.04);color:#e9fbff;outline:0;font-size:13px;
}
input:focus{border-color:rgba(0,229,255,.62)}
button{
  width:100%;margin-top:12px;padding:11px;border:0;border-radius:9px;cursor:pointer;
  background:linear-gradient(135deg,#00d9f5,#00e49a);color:#04201c;font-weight:800;font-size:12px;
}
.error{min-height:18px;margin-top:10px;color:#ff9f8e;font-size:11px}
</style>
</head>
<body>
<form class="card" id="form">
  <div class="mark">V</div>
  <h1>Video Knowledge Studio</h1>
  <p>输入部署时设置的 <code>VKS_PASSWORD</code>。本机 127.0.0.1 默认无需登录。</p>
  <label for="password">访问密码</label>
  <input id="password" type="password" autocomplete="current-password" autofocus>
  <button type="submit">进入工坊</button>
  <div class="error" id="error"></div>
</form>
<script>
document.getElementById("form").onsubmit = async (event) => {
  event.preventDefault();
  const response = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password: document.getElementById("password").value}),
  });
  const data = await response.json();
  if (!data.ok) {
    document.getElementById("error").textContent = data.error || "登录失败";
    return;
  }
  localStorage.setItem("vks_token", data.token);
  location.href = "/?t=" + encodeURIComponent(data.token);
};
</script>
</body>
</html>
