<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Demand-driven learning workflow</title>
  <desc id="desc">A knowledge gap is planned, researched across Bilibili and YouTube, produced into a course, opened with notes, and explored through contextual AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071016"/>
      <stop offset="1" stop-color="#0b1b24"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#55c7dd"/>
    </marker>
    <style>
      .title{font:700 32px "Segoe UI",sans-serif;fill:#eefaff}
      .sub{font:14px "Cascadia Code",Consolas,monospace;fill:#7895a2;letter-spacing:1.5px}
      .num{font:12px "Cascadia Code",Consolas,monospace;fill:#56d8f5}
      .stage{font:700 20px "Segoe UI",sans-serif;fill:#eefaff}
      .body{font:14px "Segoe UI",sans-serif;fill:#9eb7c2}
      .small{font:12px "Cascadia Code",Consolas,monospace;fill:#6f8e9c}
      .tag{font:12px "Segoe UI",sans-serif;fill:#7fe0b5}
    </style>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <path d="M0 90H1600M0 220H1600M0 350H1600M0 480H1600M0 610H1600M0 740H1600" stroke="#17303b" opacity=".5"/>
  <path d="M120 0V780M320 0V780M520 0V780M720 0V780M920 0V780M1120 0V780M1320 0V780M1520 0V780" stroke="#17303b" opacity=".28"/>
  <text x="54" y="58" class="title">Demand-driven learning: from a question to a course you can question</text>
  <text x="56" y="82" class="sub">PLAN → SEARCH → SELECT → INTEGRATE → LEARN → ASK</text>

  <g filter="url(#shadow)">
    <rect x="54" y="132" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="54" y="132" width="330" height="6" rx="3" fill="#56d8f5"/>
    <text x="78" y="170" class="num">01 · DEFINE</text>
    <text x="78" y="206" class="stage">Name the real problem</text>
    <text x="78" y="240" class="body">Project gap, paper question, or role target</text>
    <text x="78" y="268" class="body">Current knowledge + time + deadline</text>
    <text x="78" y="296" class="body">What you must be able to do afterward</text>
    <text x="78" y="320" class="tag">Output: learning-brief.md</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="132" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="430" y="132" width="330" height="6" rx="3" fill="#46c6a3"/>
    <text x="454" y="170" class="num">02 · SEARCH</text>
    <text x="454" y="206" class="stage">Find candidate sources</text>
    <text x="454" y="240" class="body">Bilibili + YouTube keyword searches</text>
    <text x="454" y="268" class="body">Cross-language and synonym queries</text>
    <text x="454" y="296" class="body">Record title, author, duration, captions</text>
    <text x="454" y="320" class="tag">Never invent URLs, captions, or times</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="806" y="132" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="806" y="132" width="330" height="6" rx="3" fill="#ffb454"/>
    <text x="830" y="170" class="num">03 · SELECT</text>
    <text x="830" y="206" class="stage">Choose complements, not duplicates</text>
    <text x="830" y="240" class="body">Relevance, correctness, evidence, access</text>
    <text x="830" y="268" class="body">One intuition, one derivation, one build</text>
    <text x="830" y="296" class="body">A course needs at least two real sources</text>
    <text x="830" y="320" class="tag">Output: sources.json</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1182" y="132" width="364" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="1182" y="132" width="364" height="6" rx="3" fill="#8d7dff"/>
    <text x="1206" y="170" class="num">04 · PLAN</text>
    <text x="1206" y="206" class="stage">Budget the path</text>
    <text x="1206" y="240" class="body">Must learn / understand / defer</text>
    <text x="1206" y="268" class="body">Prerequisites, practice, review points</text>
    <text x="1206" y="296" class="body">Split small goals into scipop lessons</text>
    <text x="1206" y="320" class="tag">Output: learning-plan.md</text>
  </g>

  <path d="M384 231H412" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M760 231H788" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1136 231H1164" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1182" y="448" width="364" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="1182" y="448" width="364" height="6" rx="3" fill="#73e3a5"/>
    <text x="1206" y="486" class="num">05 · PRODUCE</text>
    <text x="1206" y="522" class="stage">Create an animated lesson</text>
    <text x="1206" y="556" class="body">course: long multi-source synthesis</text>
    <text x="1206" y="584" class="body">scipop: focused 2–6 minute lesson</text>
    <text x="1206" y="612" class="body">remix: information-preserving source edit</text>
    <text x="1206" y="636" class="tag">gates → TTS → captions → MP4</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="806" y="448" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="806" y="448" width="330" height="6" rx="3" fill="#56d8f5"/>
    <text x="830" y="486" class="num">06 · NOTES</text>
    <text x="830" y="522" class="stage">Make knowledge searchable</text>
    <text x="830" y="556" class="body">Define terms before derivation</text>
    <text x="830" y="584" class="body">Timeline, visual evidence, pitfalls</text>
    <text x="830" y="612" class="body">Practice, recap, knowledge graph</text>
    <text x="830" y="636" class="tag">Write into the course pack</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="448" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="430" y="448" width="330" height="6" rx="3" fill="#46c6a3"/>
    <text x="454" y="486" class="num">07 · LEARN</text>
    <text x="454" y="522" class="stage">Watch, note, verify</text>
    <text x="454" y="556" class="body">Playback highlights the current block</text>
    <text x="454" y="584" class="body">Click a timestamp to return to the source</text>
    <text x="454" y="612" class="body">Key frames follow the note</text>
    <text x="454" y="636" class="tag">Learning workspace</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="54" y="448" width="330" height="198" rx="18" fill="#0d202a" stroke="#2b5d58"/>
    <rect x="54" y="448" width="330" height="6" rx="3" fill="#ffb454"/>
    <text x="78" y="486" class="num">08 · ASK</text>
    <text x="78" y="522" class="stage">Ask where understanding stops</text>
    <text x="78" y="556" class="body">Select any note text</text>
    <text x="78" y="584" class="body">AI receives the second, transcript and frame</text>
    <text x="78" y="612" class="body">Suggestions require acceptance and are reversible</text>
    <text x="78" y="636" class="tag">explain / check / annotate / revise</text>
  </g>

  <path d="M1364 330V436" stroke="#55c7dd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1182 547H1160" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M806 547H784" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M430 547H408" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="54" y="696" width="1492" height="48" rx="12" fill="#09171f" stroke="#1d3b47"/>
  <text x="78" y="726" class="body">Built in: multi-source integration, animated video, synchronized notes and grounded AI. Source discovery and planning are performed by an Agent with search tools.</text>
</svg>
