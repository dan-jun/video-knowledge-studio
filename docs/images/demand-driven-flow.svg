<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Demand-driven learning workflow</title>
  <desc id="desc">A knowledge gap is planned, researched across Bilibili and YouTube, produced into a course, opened with notes, and explored through contextual AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071016"/>
      <stop offset="1" stop-color="#0b1b24"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#55c7dd"/>
    </marker>
    <style>
      .title{font:700 32px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#eefaff}
      .sub{font:14px "Cascadia Code",Consolas,monospace;fill:#7895a2;letter-spacing:1.5px}
      .num{font:12px "Cascadia Code",Consolas,monospace;fill:#56d8f5}
      .stage{font:700 20px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#eefaff}
      .body{font:14px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#9eb7c2}
      .small{font:12px "Cascadia Code",Consolas,monospace;fill:#6f8e9c}
      .tag{font:12px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#7fe0b5}
    </style>
  </defs>
  <rect width="1600" height="780" fill="url(#bg)"/>
  <path d="M0 90H1600M0 220H1600M0 350H1600M0 480H1600M0 610H1600M0 740H1600" stroke="#17303b" opacity=".5"/>
  <path d="M120 0V780M320 0V780M520 0V780M720 0V780M920 0V780M1120 0V780M1320 0V780M1520 0V780" stroke="#17303b" opacity=".28"/>
  <text x="54" y="58" class="title">按需学习：从一个问题到一套可追问的课程</text>
  <text x="56" y="82" class="sub">PLAN → SEARCH → SELECT → INTEGRATE → LEARN → ASK</text>

  <g filter="url(#shadow)">
    <rect x="54" y="132" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="54" y="132" width="330" height="6" rx="3" fill="#56d8f5"/>
    <text x="78" y="170" class="num">01 · DEFINE</text>
    <text x="78" y="206" class="stage">说清真正要解决的问题</text>
    <text x="78" y="240" class="body">项目缺口、论文问题或面试目标</text>
    <text x="78" y="268" class="body">已有基础 + 总时间 + 截止时间</text>
    <text x="78" y="296" class="body">完成后要能做到什么</text>
    <text x="78" y="320" class="tag">输出：learning-brief.md</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="132" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="430" y="132" width="330" height="6" rx="3" fill="#46c6a3"/>
    <text x="454" y="170" class="num">02 · SEARCH</text>
    <text x="454" y="206" class="stage">搜索多个候选来源</text>
    <text x="454" y="240" class="body">B站 + YouTube 多关键词检索</text>
    <text x="454" y="268" class="body">中文、英文和同义表达交叉搜索</text>
    <text x="454" y="296" class="body">记录标题、作者、时长和字幕</text>
    <text x="454" y="320" class="tag">不虚构 URL / 字幕 / 时间戳</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="806" y="132" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="806" y="132" width="330" height="6" rx="3" fill="#ffb454"/>
    <text x="830" y="170" class="num">03 · SELECT</text>
    <text x="830" y="206" class="stage">选择互补而不是重复</text>
    <text x="830" y="240" class="body">相关性、正确性、证据和可访问性</text>
    <text x="830" y="268" class="body">一个讲直觉，一个讲推导，一个讲实现</text>
    <text x="830" y="296" class="body">course 至少登记两个真实来源</text>
    <text x="830" y="320" class="tag">输出：sources.json</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1182" y="132" width="364" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="1182" y="132" width="364" height="6" rx="3" fill="#8d7dff"/>
    <text x="1206" y="170" class="num">04 · PLAN</text>
    <text x="1206" y="206" class="stage">按时间和基础排学习路径</text>
    <text x="1206" y="240" class="body">必学 / 理解 / 暂缓，避免平均用力</text>
    <text x="1206" y="268" class="body">概念依赖、练习点和复习点</text>
    <text x="1206" y="296" class="body">较短目标优先拆成多个 scipop</text>
    <text x="1206" y="320" class="tag">输出：learning-plan.md</text>
  </g>

  <path d="M384 231H412" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M760 231H788" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1136 231H1164" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1182" y="448" width="364" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="1182" y="448" width="364" height="6" rx="3" fill="#73e3a5"/>
    <text x="1206" y="486" class="num">05 · PRODUCE</text>
    <text x="1206" y="522" class="stage">整合成动画讲解</text>
    <text x="1206" y="556" class="body">course：多来源长教学</text>
    <text x="1206" y="584" class="body">scipop：2–6 分钟单点专题</text>
    <text x="1206" y="612" class="body">remix：单源信息守恒重制</text>
    <text x="1206" y="636" class="tag">门禁 → TTS → 字幕 → MP4</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="806" y="448" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="806" y="448" width="330" height="6" rx="3" fill="#56d8f5"/>
    <text x="830" y="486" class="num">06 · NOTES</text>
    <text x="830" y="522" class="stage">把知识变成可检索结构</text>
    <text x="830" y="556" class="body">术语先定义，再进入推导</text>
    <text x="830" y="584" class="body">时间轴、画面证据、易错点</text>
    <text x="830" y="612" class="body">练习、复盘和知识网</text>
    <text x="830" y="636" class="tag">写入课程包</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="448" width="330" height="198" rx="18" fill="#0d202a" stroke="#214653"/>
    <rect x="430" y="448" width="330" height="6" rx="3" fill="#46c6a3"/>
    <text x="454" y="486" class="num">07 · LEARN</text>
    <text x="454" y="522" class="stage">边看、边记、边验证</text>
    <text x="454" y="556" class="body">播放时间高亮当前知识块</text>
    <text x="454" y="584" class="body">点击时间戳回到原讲解</text>
    <text x="454" y="612" class="body">关键画面跟着笔记出现</text>
    <text x="454" y="636" class="tag">学习工作台</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="54" y="448" width="330" height="198" rx="18" fill="#0d202a" stroke="#2b5d58"/>
    <rect x="54" y="448" width="330" height="6" rx="3" fill="#ffb454"/>
    <text x="78" y="486" class="num">08 · ASK</text>
    <text x="78" y="522" class="stage">不懂的地方直接追问</text>
    <text x="78" y="556" class="body">选中右侧任意笔记文字</text>
    <text x="78" y="584" class="body">AI 带上当前秒数、附近讲稿和画面</text>
    <text x="78" y="612" class="body">建议先展示，接受后才修改并可撤销</text>
    <text x="78" y="636" class="tag">解释 / 查错 / 旁注 / 修订</text>
  </g>

  <path d="M1364 330V436" stroke="#55c7dd" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1182 547H1160" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M806 547H784" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M430 547H408" stroke="#55c7dd" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="54" y="696" width="1492" height="48" rx="12" fill="#09171f" stroke="#1d3b47"/>
  <text x="78" y="726" class="body">当前已内置：多来源整合、动画成片、笔记与 AI 问答。主题搜索与学习规划由具备搜索工具的 Agent 执行。</text>
</svg>
