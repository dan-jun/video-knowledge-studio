<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d13"/>
      <stop offset=".58" stop-color="#0a1b24"/>
      <stop offset="1" stop-color="#0d2a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d8f5"/>
      <stop offset="1" stop-color="#73e3a5"/>
    </linearGradient>
    <clipPath id="shotClip">
      <rect x="724" y="104" width="500" height="300" rx="18"/>
    </clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <style>
      .eyebrow{font:600 16px "Cascadia Code",Consolas,monospace;fill:#56d8f5;letter-spacing:2px}
      .title{font:700 44px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#f1fbff}
      .headline{font:700 31px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#dff8ff}
      .body{font:18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#9dbac6}
      .chip{font:600 15px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#dff8ff}
      .small{font:13px "Cascadia Code",Consolas,monospace;fill:#718f9d}
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1070" cy="90" r="160" fill="#0cb6cf" opacity=".12" filter="url(#glow)"/>
  <circle cx="770" cy="510" r="140" fill="#00d69d" opacity=".08" filter="url(#glow)"/>
  <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280" stroke="#17313c" opacity=".36"/>
  <path d="M80 0V640M240 0V640M400 0V640M560 0V640M720 0V640M880 0V640M1040 0V640M1200 0V640" stroke="#17313c" opacity=".25"/>

  <rect x="54" y="52" width="42" height="42" rx="12" fill="#0d2530" stroke="#56d8f5"/>
  <text x="67" y="80" class="eyebrow" style="font-size:20px;fill:#56d8f5">V</text>
  <text x="110" y="80" class="eyebrow">LOCAL-FIRST · AI LEARNING WORKSPACE</text>

  <text x="54" y="151" class="title">Video Knowledge Studio</text>
  <text x="54" y="201" class="headline">从一个知识缺口，</text>
  <text x="54" y="239" class="headline">到一套真正学得会的课程。</text>
  <text x="54" y="286" class="body">规划多来源 · 生成动画课程 · 同步知识笔记 · 带证据问 AI</text>

  <rect x="54" y="329" width="118" height="38" rx="19" fill="#102b35" stroke="#24505d"/>
  <text x="74" y="354" class="chip">多源搜课</text>
  <rect x="184" y="329" width="118" height="38" rx="19" fill="#102b35" stroke="#24505d"/>
  <text x="204" y="354" class="chip">动画成片</text>
  <rect x="314" y="329" width="146" height="38" rx="19" fill="#102b35" stroke="#24505d"/>
  <text x="334" y="354" class="chip">同步知识笔记</text>
  <rect x="472" y="329" width="150" height="38" rx="19" fill="#102b35" stroke="#24505d"/>
  <text x="492" y="354" class="chip">右侧追问 AI</text>

  <rect x="54" y="416" width="568" height="2" fill="url(#accent)"/>
  <text x="54" y="454" class="body">课程、制作项目、批注和修订都保存在自己的电脑上。</text>
  <text x="54" y="485" class="small">GITHUB.COM/DAN-JUN/VIDEO-KNOWLEDGE-STUDIO</text>

  <g>
    <rect x="706" y="86" width="536" height="336" rx="24" fill="#07131a" stroke="#25515e" stroke-width="2"/>
    <image href="demo.png" x="724" y="104" width="500" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#shotClip)"/>
    <rect x="896" y="414" width="338" height="66" rx="14" fill="#0b2029" stroke="#2a5d64"/>
    <text x="916" y="440" class="small" style="fill:#7de3b4">LIVE PRODUCT</text>
    <text x="916" y="464" class="body" style="font-size:16px">视频 + 笔记 + 画面证据 + AI 上下文</text>
  </g>

  <path d="M88 568H1192" stroke="#173b47"/>
  <text x="54" y="606" class="small">VIDEO → EVIDENCE → NOTES → MASTERY</text>
  <text x="1010" y="606" class="small" style="fill:#73e3a5">MIT · 0.2.5</text>
</svg>
