services:
  studio:
    build: .
    ports:
      - "127.0.0.1:${VKS_DOCKER_PORT:-7870}:7870"
    environment:
      VKS_PASSWORD: "${VKS_PASSWORD:?set VKS_PASSWORD before starting the container}"
      VKS_AI_PROVIDER: "${VKS_AI_PROVIDER:-mock}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      VKS_MODEL: "${VKS_MODEL:-gpt-4.1-mini}"
    volumes:
      - ./packs:/app/packs:ro
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7870/login.html', timeout=3)"
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    init: true
    restart: unless-stopped
