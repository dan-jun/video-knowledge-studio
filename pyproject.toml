[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-knowledge-studio"
version = "0.1.0"
description = "Turn course videos into synchronized, evidence-linked knowledge notes."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Video Knowledge Studio contributors"}]
keywords = ["video", "education", "knowledge-base", "ai-tutor", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
]

[project.scripts]
vks = "vks.server:main"

[project.optional-dependencies]
demo = ["Pillow>=10"]
dev = ["Pillow>=10"]

[tool.setuptools]
packages = ["vks"]
