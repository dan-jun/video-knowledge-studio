name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q vks scripts tests production/promo
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/knowledge.js
      - run: node --check web/production.js
      - run: node --check production/promo/record_product.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create secret-like files for build-context check
        run: |
          mkdir -p data
          printf 'must-not-ship' > data/.session_secret
          printf 'must-not-ship' > data/studio.pid
      - name: Build image
        run: docker build -t video-knowledge-studio:test .
      - name: Verify private state is not in image
        run: |
          docker run --rm --entrypoint sh video-knowledge-studio:test -c \
            'test ! -e /app/data/.session_secret && test ! -e /app/data/studio.pid'
      - name: Start and health check
        run: |
          docker run -d --name vks-test \
            -e VKS_PASSWORD=test-password \
            -e VKS_AI_PROVIDER=mock \
            -p 17870:7870 \
            video-knowledge-studio:test
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:17870/login.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs vks-test
          exit 1
      - name: Verify production mode UI and dependencies
        run: |
          docker exec vks-test python -c \
            'import manim, edge_tts, matplotlib, fontTools; print("production dependencies OK")'
          curl -fsS -c cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"password":"test-password"}' \
            http://127.0.0.1:17870/api/login >/dev/null
          curl -fsS -b cookies.txt http://127.0.0.1:17870/production.html \
            | grep -q '视频制作'
          curl -fsS -b cookies.txt http://127.0.0.1:17870/api/production/modes \
            | grep -q '"scipop"'
      - name: Container logs on failure
        if: failure()
        run: docker logs vks-test || true
      - name: Stop test container
        if: always()
        run: docker rm -f vks-test || true
